name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - uses: actions/upload-artifact@v4
        with:
          name: npm-lockfile
          path: package-lock.json
          retention-days: 1
      - run: npm test
      - run: npm run build
